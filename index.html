<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SKJ Money Diary</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d9488">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#ecfdf5;--card:#fff;--tx:#10302b;--mut:#64807a;--ac:#0d9488;--cr:#16a34a;--ex:#dc2626;--tr:#d97706;--bd:#d3ebe4;--g1:#0d9488;--g2:#2563eb;--sh:0 2px 10px rgba(16,48,43,.08);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0b1715;--card:#13251f;--tx:#e6f6f1;--mut:#92b1a8;--ac:#2dd4bf;--cr:#4ade80;--ex:#f87171;--tr:#fbbf24;--bd:#23403a;--g1:#0f766e;--g2:#1d4ed8;--sh:0 2px 10px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding:0 14px 150px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hdr{position:sticky;top:0;z-index:15;touch-action:pan-y;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:0 0 22px 22px;padding:10px 14px 12px;margin:0 -14px 14px;box-shadow:0 6px 18px rgba(13,148,136,.3)}
.ht{display:flex;justify-content:space-between;align-items:center}.ht h1{font-size:17px;margin:0}.ht span{font-size:13px;font-weight:700;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:99px}
.date{display:flex;align-items:center;justify-content:space-between;margin-top:8px}.date b{flex:1;text-align:center;font-size:16px}
.nav{width:46px;height:40px;font-size:22px;border-radius:10px;background:rgba(255,255,255,.22);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:var(--sh)}
.card h3{margin:0 0 6px;color:var(--ac);font-size:15px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid var(--bd);vertical-align:top;font-size:14px}
th{text-align:right;font-size:12px;color:var(--mut)}th:first-child{text-align:left}tr:last-child td{border-bottom:0}
.st td:last-child,.yt td+td{text-align:right;font-weight:700;white-space:nowrap}
.cc{color:var(--cr)}.ce{color:var(--ex)}.ct{color:var(--tr)}
.tl td:first-child{width:46px;font-weight:700;text-align:center}.tl small,.d small{display:block;color:var(--mut);font-weight:600;font-size:11px}
.tl td.a{text-align:right;font-weight:700;white-space:nowrap}.tl tr{cursor:pointer}
.yt{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0}.yt th{background:var(--bg);padding:9px 4px;font-size:12px;font-weight:800;color:var(--ac);border-bottom:2px solid var(--ac)}.yt th:first-child{border-radius:8px 0 0 0}.yt th:last-child{border-radius:0 8px 0 0}
.yt tr:nth-child(even) td{background:rgba(13,148,136,.06)}.yt td:last-child,.yt th:last-child{padding-right:6px}.yt td:first-child,.yt th:first-child{padding-left:6px}
.lgd{font-size:11px;color:var(--mut);text-align:center;margin-top:10px}
.yt th,.yt td{text-align:right;padding:9px 3px;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.yt th:first-child,.yt td:first-child{text-align:left;width:19%;font-weight:700}.yt td.z{color:var(--mut);font-weight:400}
.yt tr.tot td{font-weight:800;border-top:2px solid var(--ac);background:var(--bg)!important}.yw{overflow-x:auto}
.empty{color:var(--mut);text-align:center;padding:24px 0}
input{width:100%;padding:12px;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
input:focus{outline:0;border-color:var(--ac)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chips button,.seg button{padding:8px 12px;border-radius:99px;border:2px solid var(--ac);color:var(--ac);font-weight:700;font-size:13px}
.chips button.on,.seg button.on{background:var(--ac);color:#fff}.seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.pri{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:11px 18px;border-radius:12px;font-weight:700}
.gh{background:var(--bg);border:1px solid var(--bd);padding:10px 14px;border-radius:12px;font-weight:600;font-size:14px}
.btns{display:flex;gap:8px}.btns button{flex:1}
#fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-size:32px;box-shadow:0 6px 18px rgba(13,148,136,.45);z-index:12}
.bnav{position:fixed;left:0;right:0;bottom:0;display:flex;max-width:560px;margin:0 auto;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 7px;font-size:12px;font-weight:700;color:var(--mut)}.bnav span{font-size:21px}.bnav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}
.md{position:fixed;inset:0;background:rgba(5,20,16,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.md[hidden]{display:none}
.mb{background:var(--card);border-radius:18px;padding:16px;max-width:440px;width:100%;max-height:92%;overflow:auto}.mb h3{margin:0 0 10px}.mb p{color:var(--mut);margin:0 0 8px}
.mbt{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ht h1{flex:1;padding-left:10px}
.sb{position:fixed;inset:0;background:rgba(5,20,16,.6);z-index:30}.sb[hidden]{display:none}
.sbp{position:absolute;left:0;top:0;bottom:0;width:min(330px,88vw);background:var(--card);padding:calc(14px + env(safe-area-inset-top,0px)) 14px 14px;overflow:auto;box-shadow:6px 0 24px rgba(0,0,0,.3);animation:sl .2s ease-out}
@keyframes sl{from{transform:translateX(-100%)}to{transform:none}}
.sbt{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sbt h3{margin:0;color:var(--ac)}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.ch b{font-size:16px}
.nav2{width:40px;height:36px;font-size:20px;border-radius:10px;background:var(--bg);border:1px solid var(--bd)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.cg i{font-style:normal;font-size:11px;font-weight:700;color:var(--mut);padding:4px 0}
.cd{aspect-ratio:1;border-radius:50%;font-size:14px;font-weight:600;border:2.5px solid transparent;display:flex;align-items:center;justify-content:center;padding:0}
.cd.cr{border-color:var(--cr)}.cd.db{border-color:var(--ex)}
.cd.both{background:linear-gradient(var(--card),var(--card)) padding-box,conic-gradient(var(--ex) 0 50%,var(--cr) 0 100%) border-box}
.cd.tod{color:var(--ac);text-decoration:underline;font-weight:800}.cd.sel{box-shadow:0 0 0 3px var(--bd)}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:12px 0}.lg span{display:flex;align-items:center;gap:5px}
.lg u{width:14px;height:14px;border-radius:50%;border:2.5px solid;display:inline-block}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:#10302b;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}
tr.hl td{animation:hl 2s ease-out}@keyframes hl{0%,60%{background:rgba(13,148,136,.28)}100%{background:transparent}}
@media print{.hdr,.bnav,#fab{display:none!important}}
</style>
</head>
<body>
<div class="hdr"><div class="ht"><button class="nav" id="cb" aria-label="Calendar" style="width:42px;height:36px;font-size:18px">📅</button><h1>💰 SKJ Money Diary</h1><span id="pill"></span></div>
<div class="date" id="dt"><button class="nav" id="prev" aria-label="Previous">‹</button><b id="dl"></b><button class="nav" id="next" aria-label="Next">›</button></div></div>
<div id="v1"></div>
<div id="v2" hidden></div>
<div id="v3" hidden>
 <input id="q" placeholder="Search description, amount, currency, date, month…" autocomplete="off">
 <div class="chips" id="fl"><button data-f="all" class="on">All</button><button data-f="c">Credit</button><button data-f="e">Expense</button><button data-f="t">Transferred</button></div>
 <div id="sr"></div>
</div>
<button id="fab" aria-label="Add transaction">＋</button>
<nav class="bnav"><button id="t1" class="on"><span>🗓️</span>Month</button><button id="t2"><span>📊</span>Year</button><button id="t3"><span>🔍</span>Search</button></nav>
<div class="sb" id="sb" hidden><div class="sbp" id="sbp"></div></div>
<div id="toast"></div>
<div class="md" id="md" hidden><div class="mb" id="mb"></div></div>
<input type="file" id="rf" hidden>
<script>
(function(){
var K='skjMoney.v1',S={tx:[],last:'INR'},$=function(i){return document.getElementById(i);};
try{var r=localStorage.getItem(K);if(r){var q0=JSON.parse(r);if(q0&&q0.tx)S=q0;}}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(S));}catch(e){alert('Storage full or blocked. Take a backup.');}}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return iso(new Date());}
function fyOf(d){var y=+d.slice(0,4),m=+d.slice(5,7);return String(m>=4?y:y-1);}
function fyLabel(y){return 'FY '+y+'\u2013'+String(+y+1).slice(2);}
var ym=today().slice(0,7),yr=fyOf(today()),cm=ym,sel='',tab=1,flt='all',TL={c:'Credit',e:'Expense',t:'Transferred'},ft='e',eid=null,pf=null;
var CUR=['INR','USD','EUR','GBP','AED','SGD','AUD','CAD','JPY'];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function mname(m){return new Date(+m.slice(0,4),+m.slice(5)-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'});}
function mshort(i){return new Date(2000,i,1).toLocaleDateString(undefined,{month:'short'});}
function fm(c,v){return c+' '+(v/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function sums(l){var o={};l.forEach(function(t){var a=o[t.cur]||(o[t.cur]={c:0,e:0,t:0});a[t.type]+=Math.round(t.amt*100);});return o;}
function srt(l){return l.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1);});}
function find(id){return S.tx.filter(function(t){return t.id===id;})[0];}
function rows(l){return '<table class="tl">'+l.map(function(t){var d=new Date(+t.date.slice(0,4),+t.date.slice(5,7)-1,+t.date.slice(8));
 return '<tr data-i="'+t.id+'" data-d="'+t.date+'"><td>'+(+t.date.slice(8))+'<small>'+d.toLocaleDateString(undefined,{month:'short'})+'</small></td><td>'+(esc(t.desc)||'<span class="cc" style="color:var(--mut)">—</span>')+'<small>'+TL[t.type]+(t.type==='c'?'':' · Debit')+'</small></td><td class="a c'+t.type+'">'+(t.type==='c'?'+ ':'− ')+fm(t.cur,Math.round(t.amt*100))+'</td></tr>';}).join('')+'</table>';}
function render(){
 var Y=tab===2;$('dt').hidden=tab===3;$('dl').textContent=Y?fyLabel(yr):mname(ym);
 ['v1','v2','v3'].forEach(function(v,i){$(v).hidden=tab!==i+1;});[1,2,3].forEach(function(n){$('t'+n).className=tab===n?'on':'';});
 if(tab===1){var l=srt(S.tx.filter(function(t){return t.date.slice(0,7)===ym;})),s=sums(l);$('pill').textContent=l.length+' entries';
  var h=Object.keys(s).sort().map(function(c){var a=s[c],db=a.e+a.t;return '<div class="card"><h3>'+c+' · '+mname(ym)+'</h3><table class="st"><tr><td>Credits</td><td class="cc">+ '+fm(c,a.c)+'</td></tr><tr><td>Expenses</td><td class="ce">− '+fm(c,a.e)+'</td></tr><tr><td>Transferred</td><td class="ct">− '+fm(c,a.t)+'</td></tr><tr><td>Total debits</td><td>− '+fm(c,db)+'</td></tr><tr><td><b>Net</b></td><td class="'+(a.c-db>=0?'cc':'ce')+'">'+fm(c,a.c-db)+'</td></tr></table></div>';}).join('');
  $('v1').innerHTML=l.length?h+'<div class="card">'+rows(l)+'</div>':'<div class="card empty">No transactions this month.<br>Tap ＋ to add one.</div>';}
 else if(tab===2){var lo=yr+'-04-01',hi=(+yr+1)+'-03-31',all=S.tx.filter(function(t){return t.date>=lo&&t.date<=hi;}),cs=Object.keys(sums(all)).sort(),fl=fyLabel(yr);$('pill').textContent=all.length+' entries';
  var f=function(v){var u=Math.round(v/100);return Math.abs(u)>=1e7?(u/1e7).toFixed(2)+'Cr':u.toLocaleString('en-IN');},fz=function(v,c){return v?'<td class="'+c+'">'+f(v)+'</td>':'<td class="z">\u2013</td>';};
  var h2=cs.map(function(c){var tot={c:0,e:0,t:0},b='';for(var i=0;i<12;i++){var m=(3+i)%12,yy=m>=3?+yr:+yr+1,key=yy+'-'+String(m+1).padStart(2,'0'),a=(sums(all.filter(function(t){return t.cur===c&&t.date.slice(0,7)===key;}))[c])||null;
   if(a){tot.c+=a.c;tot.e+=a.e;tot.t+=a.t;}
   var n=a?a.c-a.e-a.t:0;
   b+='<tr><td>'+mshort(m)+' '+String(yy).slice(2)+'</td>'+(a?fz(a.c,'cc')+fz(a.e,'ce')+fz(a.t,'ct')+'<td class="'+(n>=0?'cc':'ce')+'">'+f(n)+'</td>':'<td class="z">\u2013</td><td class="z">\u2013</td><td class="z">\u2013</td><td class="z">\u2013</td>')+'</tr>';}
   var tn=tot.c-tot.e-tot.t;
   return '<div class="card"><h3>'+c+' \u00b7 '+fl+'</h3><div class="yw"><table class="yt"><tr><th>Month</th><th>Cr</th><th>Dr</th><th>Tr</th><th>Net</th></tr>'+b+'<tr class="tot"><td>Total</td><td class="cc">'+f(tot.c)+'</td><td class="ce">'+f(tot.e)+'</td><td class="ct">'+f(tot.t)+'</td><td class="'+(tn>=0?'cc':'ce')+'">'+f(tn)+'</td></tr></table></div><div class="lgd">Cr = Credit &nbsp;\u00b7&nbsp; Dr = Expense &nbsp;\u00b7&nbsp; Tr = Transferred &nbsp;\u00b7&nbsp; Net = Cr \u2212 Dr \u2212 Tr</div></div>';}).join('');
  $('v2').innerHTML=(h2||'<div class="card empty">No transactions in '+fl+'.</div>')+'<div class="card"><h3>Data</h3><div class="btns"><button class="gh" id="bk">Backup</button><button class="gh" id="rst">Restore</button></div></div>';}
 else{var tk=$('q').value.toLowerCase().split(/\s+/).filter(Boolean),res=srt(S.tx.filter(function(t){if(flt!=='all'&&t.type!==flt)return false;
   var hs=[t.desc,t.cur,t.date,mname(t.date.slice(0,7)),TL[t.type],t.amt.toFixed(2),String(t.amt)].join(' ').toLowerCase();return tk.every(function(k){return hs.indexOf(k)>=0;});})),s3=sums(res);$('pill').textContent=res.length+' found';
  $('sr').innerHTML=res.length?'<div class="card">'+Object.keys(s3).sort().map(function(c){var a=s3[c];return '<div><b>'+c+'</b> · <span class="cc">+'+fm(c,a.c)+'</span> · <span class="ce">−'+fm(c,a.e)+'</span> · <span class="ct">→'+fm(c,a.t)+'</span></div>';}).join('')+'</div><div class="card">'+rows(res.slice(0,300))+'</div>':'<div class="card empty">No matching transactions.</div>';}
}
function openM(h){$('mb').innerHTML=h;$('md').hidden=false;}function closeM(){$('md').hidden=true;$('mb').innerHTML='';}
function form(id){var t=id?find(id):null;eid=id||null;ft=t?t.type:'e';
 openM('<h3>'+(t?'Edit':'New')+' transaction</h3><div class="seg" id="seg"><button data-ty="c">Credit</button><button data-ty="e">Debit · Expense</button><button data-ty="t">Debit · Transferred</button></div><input id="fa" inputmode="decimal" placeholder="Amount" value="'+(t?t.amt:'')+'"><input id="fc" list="curs" placeholder="Currency (e.g. INR, USD)" maxlength="5" value="'+esc(t?t.cur:S.last)+'"><datalist id="curs">'+CUR.map(function(c){return '<option value="'+c+'">';}).join('')+'</datalist><input id="fd" type="date" value="'+(t?t.date:today())+'"><input id="fn" placeholder="Description (optional)" maxlength="120" value="'+esc(t?t.desc:'')+'"><div class="mbt"><button class="pri" data-a="save">Save</button>'+(t?'<button class="gh" data-a="del">Delete</button>':'')+'<button class="gh" data-a="x">Cancel</button></div>');segUp();}
function segUp(){[].forEach.call(document.querySelectorAll('#seg button'),function(b){b.className=b.dataset.ty===ft?'on':'';});}
function offer(){openM('<h3>Backup ready</h3><p>'+S.tx.length+' transactions. Choose how to save it.</p><div class="mbt"><button class="pri" data-a="sh">📤 Share / Save to Drive</button><button class="gh" data-a="dl">⬇ Download</button><button class="gh" data-a="x">Close</button></div>');pf={s:JSON.stringify(S),n:'SKJ_Money_Backup_'+today()+'.json'};}
function note(t){var p=document.querySelector('#mb p');if(p){p.textContent=t;p.style.color='var(--cr)';}}
$('mb').onclick=function(e){var b=e.target.closest('button');if(!b)return;var a=b.dataset.a;
 if(b.dataset.ty){ft=b.dataset.ty;segUp();return;}
 if(a==='x')closeM();
 else if(a==='save'){var amt=parseFloat(String($('fa').value).replace(/,/g,''));if(!(amt>0)){alert('Enter a valid amount.');return;}
  var cur=($('fc').value||'').trim().toUpperCase()||S.last,d=$('fd').value||today(),t=eid?find(eid):null;
  if(t){t.amt=amt;t.cur=cur;t.date=d;t.type=ft;t.desc=$('fn').value.trim();}else S.tx.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),amt:amt,cur:cur,date:d,type:ft,desc:$('fn').value.trim()});
  S.last=cur;save();ym=d.slice(0,7);yr=fyOf(d);closeM();render();}
 else if(a==='del'){S.tx=S.tx.filter(function(t){return t.id!==eid;});save();closeM();render();}
 else if(a==='sh'){try{var f=new File([pf.s],pf.n,{type:'text/plain'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Money backup'}).then(function(){note('Shared ✓');}).catch(function(){});return;}}catch(x){}note('Sharing not available. Tap Download.');}
 else if(a==='dl'){var l=document.createElement('a');l.href=URL.createObjectURL(new Blob([pf.s],{type:'application/json'}));l.download=pf.n;document.body.appendChild(l);l.click();document.body.removeChild(l);note('Downloaded ✓ Check your Downloads folder for '+pf.n);}};
$('md').onclick=function(e){if(e.target===$('md'))closeM();};
function shift(n){if(tab===2)yr=String(+yr+n);else{var y=+ym.slice(0,4),m=+ym.slice(5)-1+n;ym=iso(new Date(y,m,1)).slice(0,7);}render();}
$('prev').onclick=function(){shift(-1);};$('next').onclick=function(){shift(1);};$('fab').onclick=function(){form(null);};
[1,2,3].forEach(function(n){$('t'+n).onclick=function(){tab=n;render();window.scrollTo(0,0);};});
$('q').oninput=render;$('fl').onclick=function(e){var b=e.target.closest('button');if(!b)return;flt=b.dataset.f;[].forEach.call($('fl').children,function(x){x.className=x.dataset.f===flt?'on':'';});render();};
document.body.addEventListener('click',function(e){var tr=e.target.closest('tr[data-i]');if(tr)form(tr.dataset.i);
 if(e.target.id==='bk')offer();if(e.target.id==='rst'){$('rf').value='';$('rf').click();}});
$('rf').onchange=function(){var f=this.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){try{var o=JSON.parse(fr.result),h={};S.tx.forEach(function(t){h[t.id]=1;});var n=0;(o.tx||[]).forEach(function(t){if(!h[t.id]){S.tx.push(t);n++;}});save();render();alert('Restored '+n+' new transactions.');}catch(e){alert('That is not a valid backup file.');}};fr.readAsText(f);};
(function(){var sx=0,sy=0,h=document.querySelector('.hdr');h.addEventListener('touchstart',function(e){var t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
 h.addEventListener('touchend',function(e){var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(tab!==3&&Math.abs(dx)>45&&Math.abs(dx)>1.5*Math.abs(dy))shift(dx<0?1:-1);},{passive:true});})();
function toast(t){var e=$('toast');e.textContent=t;e.className='on';clearTimeout(toast.h);toast.h=setTimeout(function(){e.className='';},2200);}
function calHtml(){var y=+cm.slice(0,4),mo=+cm.slice(5)-1,first=new Date(y,mo,1).getDay(),dim=new Date(y,mo+1,0).getDate(),mp={},td=today();
